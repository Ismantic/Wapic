[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wapic-cws-model"
version = "0.1.0"
description = "Default Chinese word segmentation model for Wapic"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Ismantic" }]
keywords = ["chinese-word-segmentation", "crf", "nlp", "wapic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/Ismantic/Wapic"
Model = "https://huggingface.co/Ismantic/Wapic-CWS"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wapic_model = ["data/*.wac"]
